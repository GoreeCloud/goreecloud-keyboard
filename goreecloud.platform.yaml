schema_version: "0.1"

component:
  type: application
  id: goreecloud-keyboard
  product_name: GoreeCloud Keyboard
  repository: GoreeCloud/goreecloud-keyboard

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    status: planned
    version: null
    evidence:
      - README.md
    notes: Keyboard is a first-party GoreeCloud application, but canonical Mesh registration and accepted Manager platform visibility are not established.
  privacy_shield:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
    notes: Typed content is highly sensitive. Current source minimizes editor observation, suppresses suggestion behavior in sensitive editors, and keeps the portable preference scope to one explicit emoji-category choice while excluding typed and usage-derived state, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: Keyboard has local sensitive-editor safeguards and no Android network permission, but those repository controls do not establish accepted Wardveil Security integration or validation.
  everkeep:
    status: planned
    version: null
    evidence:
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
    notes: A one-field versioned portable preference format plus category-only local export and apply seams exist, but complete approved Keyboard backup/restore scope, user-facing continuity workflows, clean-target recovery, and accepted Everkeep integration remain incomplete.
  glaze_ui:
    status: partial
    version: "1.0.0"
    evidence:
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardView.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokensTest.kt
      - scripts/check_glaze_motion_evaluation.py
      - docs/glaze-ui-adoption.md
    notes: Repository-local GLAZE UI V1.0 Light/Dark geometry, palette, interaction-floor, native interaction, and authority mappings target exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38. Android CI #93 passed the first published V1 head, but Deep Dark, complete component/state, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain incomplete.
  mesh:
    status: planned
    version: null
    evidence: []
    notes: Current local typing does not depend on Mesh. Canonical GoreeCloud Mesh registration, capability publication, producer evidence, and runtime acceptance are not established for Keyboard.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: Core typing requires no GoreeCloud account. Any future account-backed personalization or synchronization must use GoreeCloud Identity, and accepted Identity integration is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved minimal Keyboard-owned durable-state backup scope without silently including typed or usage-derived history.
      - Keep emoji recents, learned input, editor context, suggestions, clipboard data, credentials, telemetry identifiers, and sensitive-editor contents out of recovery scope unless separately reviewed and authorized.
  restore:
    required: true
    requirements:
      - Preserve validation-before-write for any supported portable preference import.
      - Establish user-facing clean-target recovery and accepted Everkeep authority before product-wide restore is claimed.
  export:
    required: true
    requirements:
      - Preserve goreecloud-keyboard-preferences/1 as a privacy-minimized format whose current version contains only the explicitly selected emoji category.
      - Keep typed text, composing context, learned input, suggestion state, emoji recents, search queries, clipboard data, key history, credentials, secrets, and sensitive-editor contents out of portable output.
  portability:
    required: true
    requirements:
      - Keep schema expansion explicit and separately reviewed for privacy, retention, user control, and recovery authority.
      - Preserve the category-only reader, codec, and writer boundaries without adding editor, clipboard, local-history, network, Identity, or Mesh observation authority.

external_dependencies:
  - name: Android platform
    purpose: InputMethodService lifecycle, editor metadata, InputConnection, accessibility, configuration, and application execution environment.
    required: true

compatibility:
  requires:
    - goreecloud-platform-contract>=0.1
    - glaze-ui==1.0.0
    - android-api>=26
  provides:
    - goreecloud-keyboard-preferences/1

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/glaze-ui-adoption.md
    - scripts/check_glaze_motion_evaluation.py
    - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
    - docs/development/portable-preference-snapshot.md
    - docs/development/portable-preference-import.md
    - docs/development/portable-preference-export.md
  blockers:
    - GLAZE UI V1.0 application acceptance is incomplete; Deep Dark, complete component/state mapping, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain outstanding.
    - GoreeCloud Identity integration and acceptance are not established for any future identity-aware capability.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established for this highly sensitive input surface.
    - Everkeep integration plus approved product backup, user-facing export/import, and clean-target restore acceptance are incomplete.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Current portability covers only one explicit emoji-category preference and does not include product-wide Keyboard state.
    - Production signing, distribution, representative-device acceptance, release approval, and Stable qualification remain outstanding.
    - Platform Contract adoption and Android CI do not by themselves authorize production or Stable qualification.
