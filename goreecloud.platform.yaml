schema_version: "1.0"
component:
  id: goreecloud.keyboard
  product_name: GoreeCloud Keyboard
  kind: application
  repository: GoreeCloud/goreecloud-keyboard
  lifecycle: Development
  version: "0.1.0-dev"
  supported_platforms:
    - android
  user_facing: true
api:
  version: null
  endpoints: []
glaze_ui:
  applicable: true
  required_version: "1.0.0"
  implemented_version: "1.0.0"
  migration_status: in_progress
  evidence:
    - keyboard-glaze-source
    - keyboard-glaze-validator
    - keyboard-glaze-doc
platform_systems:
  manager:
    status: "Applicable — Nonconformant"
    justification: Keyboard is a first-party GoreeCloud application, but canonical Mesh registration and accepted Manager platform visibility are not established.
    evidence:
      - keyboard-readme
  identity:
    status: "Applicable — Nonconformant"
    justification: Core typing requires no GoreeCloud account; any future account-backed personalization or synchronization must use GoreeCloud Identity, and accepted Identity integration is not established.
    evidence:
      - keyboard-specs
  wardveil_security:
    status: "Applicable — Nonconformant"
    justification: Keyboard has local sensitive-editor safeguards and no network permission, but those repository controls do not establish accepted Wardveil Security integration or validation.
    evidence:
      - keyboard-specs
      - keyboard-ci-90
  privacy_shield:
    status: "Applicable — Nonconformant"
    justification: Typed content is highly sensitive; current source applies local minimization and sensitive-editor gating, and the portable-preference/import/export subset explicitly excludes typed and usage-derived state, but accepted Privacy Shield integration and production privacy validation are not established.
    evidence:
      - keyboard-specs
      - keyboard-ci-90
      - keyboard-portable-preferences-source
      - keyboard-portable-preferences-doc
      - keyboard-portable-import-source
      - keyboard-portable-import-doc
  everkeep:
    status: "Applicable — Nonconformant"
    justification: A one-field versioned portable preference subset and explicit local export/apply seams now exist for the emoji-category choice, but complete approved Keyboard backup/restore scope and accepted Everkeep continuity behavior are not established.
    evidence:
      - keyboard-readme
      - keyboard-specs
      - keyboard-portable-preferences-source
      - keyboard-portable-preferences-doc
      - keyboard-portable-import-source
      - keyboard-portable-import-doc
  mesh:
    status: "Applicable — Nonconformant"
    justification: Current local typing does not depend on Mesh, but Keyboard is not registered through the canonical GoreeCloud Mesh platform registry and accepted cross-service integration is not established.
    evidence:
      - keyboard-specs
  glaze_ui:
    status: "Applicable — Migration Required"
    justification: Repository-local GLAZE UI V1.0 Light/Dark geometry, palette, interaction-floor, native interaction, and authority mappings are implemented against exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38, but exact-head CI plus complete Deep Dark, component/state, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain outstanding.
    evidence:
      - keyboard-glaze-source
      - keyboard-glaze-validator
      - keyboard-glaze-doc
mesh:
  registration: required
  capabilities:
    - android-input-method
    - local-quill-suggestions
    - local-emoji-input
    - sensitive-editor-gating
  dependencies: []
  published_events: []
  consumed_events: []
  evidence: []
health:
  liveness: []
  readiness: []
recovery:
  backup_required: true
  backup_status: required_missing
  restore_required: true
  restore_status: required_missing
  last_verified_restore: null
  recovery_dependencies:
    - approved minimal Keyboard-owned durable-state inventory
    - Android private keyboard preferences selected for recovery
    - explicit privacy decision for any usage-derived state such as emoji recents before it can enter a recovery scope
    - future user dictionaries or personalization only when separately accepted
  documentation:
    - README.md
    - SPECIFICATIONS.md
    - docs/development/portable-preference-snapshot.md
    - docs/development/portable-preference-import.md
    - docs/development/portable-preference-export.md
  evidence:
    - keyboard-readme
    - keyboard-specs
    - keyboard-portable-preferences-source
    - keyboard-portable-preferences-doc
    - keyboard-portable-preferences-tests
    - keyboard-portable-import-source
    - keyboard-portable-import-doc
    - keyboard-portable-import-tests
data_portability:
  export_capability: unknown
  export_formats:
    - goreecloud-keyboard-preferences/1
  last_export_validation: null
  portability_requirements:
    - keep the portable state scope minimal and explicitly reviewed before each schema expansion
    - current version may contain only the explicitly selected emoji category
    - exclude typed text, composing context, suggestion state, learned input, emoji recents, emoji search queries, clipboard data, key-event history, credentials, secrets, and sensitive-editor contents
    - preserve privacy minimization and explicit user control
    - do not add network, editor-observation, clipboard, or local-history-reading authority to the codec, exporter, or import seam
    - validate the complete encoded payload before any preference write
    - current import authority may write only the decoded emoji category through the bounded EmojiCategoryPreferenceWriter surface
    - current export authority may read only the explicit emoji category through the bounded EmojiCategoryPreferenceReader surface
    - validate clean-target restore or deterministic reconstruction where applicable before product-wide import is claimed
  evidence:
    - keyboard-specs
    - keyboard-portable-preferences-source
    - keyboard-portable-preferences-doc
    - keyboard-portable-preferences-tests
    - keyboard-portable-import-source
    - keyboard-portable-import-doc
    - keyboard-portable-import-tests
external_dependencies:
  - id: android-platform
    purpose: Android InputMethodService lifecycle, editor metadata, input connection, accessibility, configuration, and application execution environment.
    required: true
    compatibility: Current source targets Android API 35 with minSdk 26; representative Android-version, application, accessibility, IME lifecycle, and device behavior require release acceptance.
compatibility:
  platform_releases: []
  api_requirements: []
  schema_requirements:
    - goreecloud.platform/1.0
    - goreecloud-keyboard-preferences/1
  component_requirements:
    - GLAZE UI V1.0 (1.0.0)
    - Privacy Shield accepted integration before Stable because Keyboard processes highly sensitive user input
    - Wardveil Security accepted integration before Stable
    - Everkeep accepted backup/recovery behavior for any durable Keyboard-owned user state before Stable
    - GoreeCloud Identity accepted integration for any identity-aware or synchronized capability before Stable
    - GoreeCloud Mesh platform registration before coordinated platform release acceptance
conformance:
  declared_state: migration_required
  stable_eligible: false
  checks:
    - {id: glaze-ui, mandatory: true, status: pending, evidence: [keyboard-glaze-source, keyboard-glaze-validator, keyboard-glaze-doc], note: "Repository-local GLAZE UI V1.0 mapping targets exact post-reset authority 70909bbdccad378fb7281ae1842e2f5beed64c38; exact-head CI and complete Deep Dark/component/state/accessibility/adaptive/device/HVE/release acceptance remain incomplete."}
    - {id: goreecloud-identity, mandatory: true, status: pending, evidence: [keyboard-specs]}
    - {id: wardveil-security, mandatory: true, status: pending, evidence: [keyboard-specs, keyboard-ci-90], note: "Local sensitive-editor and zero-network controls do not establish Wardveil Security platform acceptance."}
    - {id: privacy-shield, mandatory: true, status: pending, evidence: [keyboard-specs, keyboard-ci-90, keyboard-portable-preferences-source, keyboard-portable-preferences-doc, keyboard-portable-import-source, keyboard-portable-import-doc], note: "Portable preference export/import remains deliberately one-field and excludes typed and usage-derived state; this source boundary still does not establish Privacy Shield platform acceptance."}
    - {id: everkeep-recovery, mandatory: true, status: pending, evidence: [keyboard-readme, keyboard-specs, keyboard-portable-preferences-source, keyboard-portable-preferences-doc, keyboard-portable-import-source, keyboard-portable-import-doc], note: "The one-field preference snapshot and local export/apply seams are not complete Keyboard recovery or Everkeep integration."}
    - {id: mesh-registration, mandatory: true, status: pending, evidence: []}
    - {id: api-compatibility, mandatory: true, status: pending, evidence: [keyboard-specs], note: "Keyboard currently declares no cross-component API; coordinated release compatibility acceptance is not established."}
    - {id: accessibility, mandatory: true, status: pending, evidence: [keyboard-glaze-doc], note: "V1 source mapping exists; Deep Dark, TalkBack, Switch Access, large-text/reflow, RTL/localization, Touch Assistance resolution, and representative-device acceptance remain outstanding."}
    - {id: platform-acceptance, mandatory: true, status: pending, evidence: []}
    - {id: backup, mandatory: true, status: pending, evidence: [keyboard-readme, keyboard-specs, keyboard-portable-preferences-source, keyboard-portable-preferences-doc], note: "A minimal preference serialization subset exists, but the approved product backup scope and Everkeep path remain missing."}
    - {id: restore, mandatory: true, status: pending, evidence: [keyboard-readme, keyboard-specs, keyboard-portable-preferences-source, keyboard-portable-preferences-doc, keyboard-portable-import-source, keyboard-portable-import-doc], note: "A one-field Development SharedPreferences apply seam exists after complete decode validation, but no user-facing, product-wide, clean-target, Everkeep-authorized restore path is implemented or accepted."}
    - {id: export-portability, mandatory: true, status: pending, evidence: [keyboard-specs, keyboard-portable-preferences-source, keyboard-portable-preferences-doc, keyboard-portable-preferences-tests, keyboard-portable-import-source, keyboard-portable-import-doc, keyboard-portable-import-tests], note: "Version 1 proves a privacy-minimized one-field schema plus category-only export/apply seams; no user-facing product export/import or clean-target acceptance exists."}
    - {id: security-validation, mandatory: true, status: pending, evidence: [keyboard-specs, keyboard-ci-90, keyboard-portable-import-source], note: "Repository-level input/privacy guards and bounded import authority do not establish Wardveil Security acceptance."}
    - {id: privacy-validation, mandatory: true, status: pending, evidence: [keyboard-specs, keyboard-ci-90, keyboard-portable-preferences-source, keyboard-portable-preferences-doc, keyboard-portable-import-source, keyboard-portable-import-doc], note: "The portability/import/export subset excludes sensitive and usage-derived state and can read/write only the selected category, but accepted Privacy Shield validation remains pending."}
    - {id: required-documentation, mandatory: true, status: pass, evidence: [keyboard-readme, keyboard-specs, keyboard-glaze-doc, keyboard-portable-preferences-doc, keyboard-portable-import-doc]}
    - {id: required-tests, mandatory: true, status: pending, evidence: [keyboard-ci-90, keyboard-portable-preferences-tests, keyboard-portable-import-tests], note: "Pre-reset exact-head Android CI evidence exists for the portability stack; the GLAZE UI V1.0 migration requires fresh exact-head Android CI before current required-tests can pass."}
    - {id: release-evidence, mandatory: true, status: pending, evidence: []}
evidence:
  acceptance:
    - id: keyboard-readme
      kind: documentation
      location: README.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Repository-local Development behavior, local-first privacy posture, emoji/input state, platform boundaries, and remaining release gaps. Documentation alone does not satisfy production gates.
    - id: keyboard-specs
      kind: documentation
      location: SPECIFICATIONS.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Repository-local native input scope and Privacy Shield, Wardveil Security, Everkeep, Identity, Mesh, GLAZE UI, and production acceptance boundaries.
    - id: keyboard-glaze-source
      kind: source
      location: android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Native Android mapping of the consumed GLAZE UI V1.0 spacing, 12 dp control radius tier, 48/56 dp interaction floors, and Light/Dark palette subset at exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38. Source mapping does not establish complete application acceptance.
    - id: keyboard-glaze-validator
      kind: automated_test
      location: scripts/check_glaze_motion_evaluation.py
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Fail-closed repository guard for the current GLAZE UI V1.0 source mapping and Experimental Glaze Motion test-only quarantine. Validator source is not itself a successful run.
    - id: keyboard-glaze-doc
      kind: documentation
      location: docs/glaze-ui-adoption.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Repository-local GLAZE UI V1.0 source mapping, V1 System Shell classification, privacy/authority boundaries, historical-evidence separation, and outstanding application acceptance record.
    - id: keyboard-ci-90
      kind: automated_test
      location: https://github.com/GoreeCloud/goreecloud-keyboard/actions/runs/33710619748
      revision: f7a34364652f3c03f08a1e5b7752179126ed6b9c
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Historical pre-reset exact-head Android CI #90 passed the one-field portable-preference snapshot base. It is implementation ancestry only and does not establish current GLAZE UI V1.0 acceptance.
    - id: keyboard-portable-preferences-source
      kind: source
      location: android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferences.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Versioned bounded codec whose v1 schema contains only the explicitly selected emoji category and rejects extra records, unknown categories, malformed snapshots, and checksum tampering without reading editor or usage-history state.
    - id: keyboard-portable-preferences-doc
      kind: documentation
      location: docs/development/portable-preference-snapshot.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Explicit privacy-minimized scope, sensitive and usage-derived exclusions, authority boundary, and Everkeep/Privacy Shield acceptance gaps for the portable preference subset.
    - id: keyboard-portable-preferences-tests
      kind: source
      location: android/app/src/test/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferencesTest.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Unit-test source covering round-trip, excluded-field absence, checksum tampering, rejection of a correctly checksummed emoji-recents record, unknown categories, and bounded input. Test source is not itself evidence of a successful run.
    - id: keyboard-portable-import-source
      kind: source
      location: android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferenceImport.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Explicit one-field Development apply seam that fully decodes the approved snapshot before calling an EmojiCategory-only writer and has no editor, clipboard, recents, network, Identity, Mesh, or Everkeep authority.
    - id: keyboard-portable-import-doc
      kind: documentation
      location: docs/development/portable-preference-import.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Development validation-before-write, privacy, SharedPreferences, user-control, durability, and recovery acceptance boundaries for the one-field import seam.
    - id: keyboard-portable-import-tests
      kind: source
      location: android/app/src/test/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferenceImportTest.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-keyboard
      description: Unit-test source proving valid one-field writes, zero writes on invalid input, and the EmojiCategory-only writer parameter surface. Test source is not itself evidence of a successful run.
  release: []
