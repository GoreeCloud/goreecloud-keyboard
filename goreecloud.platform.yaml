schema_version: "0.1"

component:
  type: application
  id: goreecloud-keyboard
  product_name: GoreeCloud Keyboard
  repository: GoreeCloud/goreecloud-keyboard

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    status: planned
    version: null
    evidence:
      - README.md
    notes: Keyboard is a first-party GoreeCloud application, but canonical Mesh registration and accepted Manager platform visibility are not established.
  privacy_shield:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
    notes: Typed content is highly sensitive. Current source minimizes editor observation and keeps the explicit user file-transfer scope to one emoji-category choice. Import now validates and previews that one category before any local preference write, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/development/portable-preference-import-preview.md
    notes: Keyboard has local sensitive-editor safeguards, no Android network permission, bounded explicit file transfer through the platform document picker, and preview-before-write behavior, but these repository controls do not establish accepted Wardveil Security integration or validation.
  everkeep:
    status: planned
    version: null
    evidence:
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
    notes: A one-field versioned portable preference format, category-only local export/apply seams, and an explicit user-controlled Storage Access Framework transfer surface exist. Preview-before-write improves user control but does not provide complete approved Keyboard backup/restore scope, clean-target recovery, automatic continuity, or accepted Everkeep integration.
  glaze_ui:
    status: partial
    version: "1.0.0"
    evidence:
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardView.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferencesActivity.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokensTest.kt
      - scripts/check_glaze_motion_evaluation.py
      - docs/glaze-ui-adoption.md
    notes: Repository-local GLAZE UI V1.0 Light/Dark geometry, palette, interaction-floor, native input, and Application settings mappings target exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38. The parent user-transfer head passed exact-head Android CI #97; this preview child still requires fresh exact-head CI and does not complete Deep Dark, component/state, accessibility, adaptive, representative-device, Human Visual Excellence, release, or production acceptance.
  mesh:
    status: planned
    version: null
    evidence: []
    notes: Current local typing does not depend on Mesh. Canonical GoreeCloud Mesh registration, capability publication, producer evidence, and runtime acceptance are not established for Keyboard.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    status: planned
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: Core typing and the local category-only transfer flow require no GoreeCloud account. Any future account-backed personalization or synchronization must use GoreeCloud Identity, and accepted Identity integration is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved minimal Keyboard-owned durable-state backup scope without silently including typed or usage-derived history.
      - Keep emoji recents, learned input, editor context, suggestions, clipboard data, credentials, telemetry identifiers, and sensitive-editor contents out of recovery scope unless separately reviewed and authorized.
  restore:
    required: true
    requirements:
      - Preserve validation-before-write for the supported category-only portable preference import.
      - Require the native user transfer flow to preview the decoded category and obtain explicit Apply confirmation before invoking the category writer.
      - Treat the explicit Storage Access Framework import as one-field portability, not product-wide clean-target recovery or Everkeep restore acceptance.
  export:
    required: true
    requirements:
      - Preserve goreecloud-keyboard-preferences/1 as a privacy-minimized format whose current version contains only the explicitly selected emoji category.
      - Keep typed text, composing context, learned input, suggestion state, emoji recents, search queries, clipboard data, key history, credentials, secrets, and sensitive-editor contents out of portable output.
      - Keep file export user-initiated through Android's document picker without background URI retention or automatic synchronization.
  portability:
    required: true
    requirements:
      - Keep schema expansion explicit and separately reviewed for privacy, retention, user control, and recovery authority.
      - Preserve the category-only reader, codec, writer, explicit file-transfer, and preview-confirmation boundaries without adding editor, clipboard, local-history, network, Identity, or Mesh observation authority.

external_dependencies:
  - name: Android platform
    purpose: InputMethodService lifecycle, editor metadata, InputConnection, Storage Access Framework document selection, native confirmation UI, accessibility, configuration, and application execution environment.
    required: true

compatibility:
  requires:
    - goreecloud-platform-contract>=0.1
    - glaze-ui==1.0.0
    - android-api>=26
  provides:
    - goreecloud-keyboard-preferences/1

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/glaze-ui-adoption.md
    - scripts/check_glaze_motion_evaluation.py
    - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
    - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferencesActivity.kt
    - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferenceTransfer.kt
    - docs/development/portable-preference-snapshot.md
    - docs/development/portable-preference-import.md
    - docs/development/portable-preference-export.md
    - docs/development/portable-preference-user-transfer.md
    - docs/development/portable-preference-import-preview.md
  blockers:
    - GLAZE UI V1.0 application acceptance is incomplete; the Application settings transfer surface also requires rendered/accessibility/device acceptance in addition to Deep Dark and complete component/state mapping.
    - GoreeCloud Identity integration and acceptance are not established for any future identity-aware capability.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established for this highly sensitive input surface.
    - Everkeep integration plus approved product backup and clean-target restore acceptance remain incomplete; the explicit user file flow is only one-field portability.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Current portability covers only one explicit emoji-category preference and does not include product-wide Keyboard state.
    - Production signing, distribution, representative-device acceptance, release approval, and Stable qualification remain outstanding.
    - Platform Contract adoption and Android CI do not by themselves authorize production or Stable qualification.
