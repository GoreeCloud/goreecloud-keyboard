platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: Keyboard is a first-party GoreeCloud application, but canonical Mesh registration and accepted Manager platform visibility are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardService.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/InputPrivacyClassifier.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicy.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/InputPrivacyClassifierTest.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicyTest.kt
      - scripts/check_editor_privacy_lifecycle.py
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: Typed content is highly sensitive. Current source keeps password/sensitive editor handling fail-closed, suppresses local composing/suggestion handling when a host text editor requests no suggestions, treats missing EditorInfo as sensitive and suggestions-suppressed rather than granting ordinary-field behavior, applies current editor policy at Android's editor-session start, and clears transient composing/policy state plus visible candidates at editor-session/view teardown. Explicit user file-transfer scope remains one emoji-category choice, imports preview before any write, exports are reviewed and frozen before destination selection, and only that reviewed category is preserved across ordinary Activity recreation while the document picker owns the flow. Accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardService.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/InputPrivacyClassifier.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicy.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/InputPrivacyClassifierTest.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicyTest.kt
      - scripts/check_editor_privacy_lifecycle.py
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: Keyboard has local sensitive-editor safeguards, host no-suggestions suppression, fail-closed handling when editor metadata is unavailable, authoritative editor-session start/finish policy reset with a fail-closed source guard, no Android network permission, bounded explicit file transfer, preview-before-write import behavior, and review-before-destination export behavior with fail-closed restoration of the reviewed category after Activity recreation, but accepted Wardveil Security integration and validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: A one-field portable preference format, category-only local export/apply seams, and explicit user-controlled Storage Access Framework transfer exist, including import preview/Apply, export review/freeze, and minimized reviewed-export lifecycle restoration, but complete approved backup/restore scope, clean-target recovery, automatic continuity, and accepted Everkeep integration do not.
  glaze_ui:
    result: applicable-migration-required
    version: "1.1.0"
    evidence:
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardAtmosphere.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardView.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferencesActivity.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokensTest.kt
      - scripts/check_glaze_motion_evaluation.py
      - docs/glaze-ui-adoption.md
    notes: Repository-local Development source targets GLAZE UI V1.1 / 1.1.0 source semantics, including explicit Deep Dark source values and bounded non-semantic atmosphere. The authoritative current-Stable Glaze correction/re-pin and application-specific rendered, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain required before current conformance can be claimed.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Current local typing does not depend on Mesh, but canonical GoreeCloud Mesh registration, capability publication, producer evidence, and runtime acceptance are not established for Keyboard.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: Core typing and the local category-only transfer flow require no GoreeCloud account, but accepted Identity integration for any future account-backed personalization or synchronization is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved minimal Keyboard-owned durable-state backup scope without silently including typed or usage-derived history.
      - Keep emoji recents, learned input, editor context, suggestions, clipboard data, credentials, telemetry identifiers, and sensitive-editor contents out of recovery scope unless separately reviewed and authorized.
  restore:
    required: true
    requirements:
      - Preserve validation-before-write for the supported category-only portable preference import.
      - Require the native user transfer flow to preview the decoded category and obtain explicit Apply confirmation before invoking the category writer.
      - Treat the explicit Storage Access Framework import as one-field portability, not product-wide clean-target recovery or Everkeep restore acceptance.
  export:
    required: true
    requirements:
      - Preserve goreecloud-keyboard-preferences/1 as a privacy-minimized format whose current version contains only the explicitly selected emoji category.
      - Keep typed text, composing context, learned input, suggestion state, emoji recents, search queries, clipboard data, key history, credentials, secrets, and sensitive-editor contents out of portable output.
      - Keep file export user-initiated through Android's document picker without background URI retention or automatic synchronization.
      - Review and freeze the one category into a typed export preview before destination selection so mutable local preference changes cannot silently alter the reviewed file contents.
      - Preserve only the already-reviewed category across Activity recreation while the Android picker owns the flow, and fail closed on missing or altered saved preview state.
  portability:
    required: true
    requirements:
      - Keep schema expansion explicit and separately reviewed for privacy, retention, user control, and recovery authority.
      - Preserve the category-only reader, codec, writer, explicit file-transfer, import-preview/confirmation, export-review/freeze, and minimized lifecycle-restoration boundaries without adding editor, clipboard, local-history, network, Identity, or Mesh observation authority.

external_dependencies:
  - name: Android platform
    purpose: InputMethodService lifecycle, editor metadata, InputConnection, Storage Access Framework document selection, native confirmation UI, accessibility, configuration, and application execution environment.
    required: true
    version_constraint: ">=26"

